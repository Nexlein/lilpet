[tools]
# Exact versions, the same locally and in CI (jdx/mise-action): a new release cannot turn CI red on unchanged code.
# Renovate opens a pull request for each new release (.github/renovate.json5), which CI checks before it is merged.
node = "26.13.0" # the current LTS line
# Secret scan of the git pre-commit hook (.husky/no-secrets.sh)
gitleaks = "8.30.1"
# C engine: build (CMake + Ninja), formatting and static analysis
cmake = "4.4.5"
ninja = "1.13.2"
"pypi:clang-format" = "23.1.3"
"pypi:clang-tidy" = "23.1.4"

# --- C engine tasks: `mise run engine:check` runs them all, like CI -------------------------------
# Sources checked by clang-format and clang-tidy
[env]
LILPET_C_SOURCES = "engine/include/lilpet/*.h engine/src/*.[ch] engine/tests/*.[ch] engine/tools/*.[ch] engine/wasm/*.[ch] firmware/main/*.[ch]"

[tasks."engine:test"]
description = "Build and run the engine tests on the host, with AddressSanitizer and UBSan"
dir = "engine"
run = "cmake --workflow --preset host-debug"

[tasks."engine:wasm"]
description = "Build the WebAssembly module (Emscripten image of engine/wasm/Dockerfile, same as CI) and check it loads in Node"
# Docker instead of mise: emsdk installed through mise ships its own clang and node, which shadow the system
# ones and break ccache. The image is pulled on first use; the Dockerfile comes from stdin (no build context).
run = [
    "docker build -t lilpet-emsdk - < engine/wasm/Dockerfile",
    'docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e EM_CACHE=/src/engine/build/emcache -v "$PWD:/src" -w /src/engine lilpet-emsdk cmake --workflow --preset wasm',
    "node engine/wasm/smoke.mjs engine/build/wasm/lilpet.mjs",
]

[tasks."engine:scenes"]
description = "Render the reference scenes with the engine into engine/build/scenes (PPM) and a contact sheet (PNG)"
depends = ["engine:test"]
run = [
    "mkdir -p engine/build/scenes",
    "engine/build/host-debug/lilpet_render_scenes engine/build/scenes",
    "ffmpeg -v error -y -pattern_type glob -i 'engine/build/scenes/*.ppm' -vf 'scale=233:-1,tile=6x6' -frames:v 1 engine/build/scenes.png",
]

[tasks."engine:bench"]
description = "Time the renderer per reference scene and over an animation (Release build); compare on one machine"
dir = "engine"
# In CI the tables also go to the job summary
run = [
    "cmake --workflow --preset host-release",
    # Into a file first: through a pipe, a crash of the bench would end with the exit code of the next command
    "build/host-release/lilpet_bench > build/host-release/bench.md",
    'cat build/host-release/bench.md; cat build/host-release/bench.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"',
]

[tasks."engine:format"]
description = "Format the C sources"
run = "clang-format -i $LILPET_C_SOURCES"

[tasks."engine:format-check"]
description = "Fail if a C source is not formatted"
run = "clang-format --dry-run --Werror $LILPET_C_SOURCES"

[tasks."engine:tidy"]
description = "Static analysis of the engine (needs engine:test first for compile_commands.json)"
depends = ["engine:test"]
run = "clang-tidy --quiet -p engine/build/host-debug engine/src/*.c engine/tests/*.c engine/tools/*.c"

[tasks."engine:check"]
description = "Everything CI checks on the engine"
depends = ["engine:format-check", "engine:test", "engine:tidy", "engine:wasm"]

# --- Firmware (ESP32-S3) ----------------------------------------------------------------------------
[tasks."firmware:build"]
description = "Build the firmware into firmware/build/merged-binary.bin, in the ESP-IDF image of firmware/Dockerfile"
# Docker instead of a local ESP-IDF install, like the WebAssembly build; CI runs this same task. The image is pulled
# on first use. The Dockerfile comes from stdin: no build context to send. ESP-IDF compiles through ccache (in the
# image); its cache lives in firmware/.ccache, kept between builds here and between runs by CI. COMPILERCHECK=content:
# the build regenerates a specs file given to the compiler, and ccache would otherwise hash its date and never hit.
run = [
    # ESP-IDF only reads sdkconfig.defaults when it creates firmware/sdkconfig: start over when they changed, or a
    # local build would keep old settings that CI (always fresh) does not have
    "if [ firmware/sdkconfig.defaults -nt firmware/sdkconfig ]; then rm -f firmware/sdkconfig; fi",
    "docker build -t lilpet-idf - < firmware/Dockerfile",
    'docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e CCACHE_DIR=/project/firmware/.ccache -e CCACHE_MAXSIZE=500M -e CCACHE_COMPILERCHECK=content -v "$PWD:/project" -w /project/firmware lilpet-idf idf.py build merge-bin',
]

[tasks."firmware:flash"]
description = "Flash the firmware to the board plugged in over USB (esptool through uvx finds the port)"
# Bootloader, partition table and app only, as listed by the build: the NVS partition, and the look kept there, stay
dir = "firmware/build"
run = "uvx esptool --chip esp32s3 write-flash @flash_args"

[tasks."firmware:check-device"]
description = "Check the flashed board over USB: hello, keeping a look across a reboot (PORT, /dev/ttyACM0 by default)"
# The only part CI cannot test (no hardware). Puts the board's own look back at the end.
run = "uvx --from pyserial python scripts/device-check.py"

[tasks."firmware:monitor"]
description = "Show what the board prints over USB (port: PORT, /dev/ttyACM0 by default; quit with Ctrl+])"
# RTS and DTR stay low so opening the port does not reset the chip into download mode
run = 'uvx --from pyserial pyserial-miniterm --raw --rts 0 --dtr 0 "${PORT:-/dev/ttyACM0}" 115200'
