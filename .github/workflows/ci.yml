name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The mise every job installs (min_version in mise.toml is the oldest that works); Renovate keeps it current. Not
  # named MISE_*: mise reads its own settings from that prefix.
  LILPET_MISE_VERSION: 2026.11.4

# The check, engine and playwright jobs are the three parts of `mise run check` (mise.toml), run in parallel: a part added
# there goes here too. The firmware jobs are `mise run firmware:build-all`, one board each.
jobs:
  check:
    name: Format, lint, data, script and app tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the tools from mise.toml, same as local development (only those `npm run check` uses). Actions are
      # pinned by commit, since a tag can be moved; Dependabot updates the pin and its comment.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.LILPET_MISE_VERSION }}
          install_args: node uv python shellcheck actionlint ruff

      - run: npm ci

      # The same command as locally (package.json): format, lint (JS, shell, workflow, Python), data, generated files,
      # board scripts on a fake port, code map, PC app types and tests. No browser or engine build needed.
      - name: Check
        run: npm run check

  engine:
    name: C engine (format, tests with sanitizers, clang-tidy, WebAssembly)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CMake, Ninja, clang-format, clang-tidy and Node from mise.toml; the WebAssembly build runs in Docker
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.LILPET_MISE_VERSION }}

      - name: Check the engine
        run: mise run engine:check

      # What the engine drew instead of a reference render (scripts/goldens.mjs), to look at
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: goldens-drawn-instead
          path: engine/build/goldens
          if-no-files-found: ignore
          retention-days: 7

      # Timings go to the job summary, to follow from commit to commit. Not a pass/fail check: shared runners are
      # too noisy for a time limit. Also runs the tests on the optimized build.
      - name: Benchmark the renderer
        run: mise run engine:bench

  boards:
    name: List the firmware boards
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      list: ${{ steps.folders.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A board is a folder of firmware/boards with a board.cmake: a new one is built with no change here
      - id: folders
        run: echo "list=$(printf '%s\n' firmware/boards/*/board.cmake | cut -d/ -f3 | jq -Rcs 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  esp32:
    name: ESP32-S3 firmware build (${{ matrix.board }})
    needs: boards
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise only runs the task: the build happens in the ESP-IDF image pinned in firmware/Dockerfile
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.LILPET_MISE_VERSION }}
          install: false

      # Compiler cache of the firmware build (firmware/.ccache): a full ESP-IDF build takes about 2 minutes without it.
      # A new entry per board and commit, starting from the latest one of the same board, ESP-IDF image and options.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: firmware/.ccache
          key: ccache-${{ matrix.board }}-${{ hashFiles('firmware/Dockerfile', 'firmware/sdkconfig.defaults', format('firmware/boards/{0}/sdkconfig.defaults', matrix.board)) }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.board }}-${{ hashFiles('firmware/Dockerfile', 'firmware/sdkconfig.defaults', format('firmware/boards/{0}/sdkconfig.defaults', matrix.board)) }}-

      # Same command as locally; proves the engine compiles for the chip (no hardware needed) and gives a binary
      # ready to flash
      - name: Build the firmware
        run: mise run firmware:build
        env:
          BOARD: ${{ matrix.board }}
          MISE_TASK_RUN_AUTO_INSTALL: 'false' # the task needs Docker only, not the tools of mise.toml

      # The licence of the BMI270 file asks for its notice to go with the binaries
      - name: Add the notices
        run: cp THIRD_PARTY.md firmware/build/${{ matrix.board }}/

      # Flash from the folder of the right board, keeping its look: uvx esptool --chip esp32s3 write-flash @flash_args
      # merged-binary.bin, written at 0x0, is for a blank board: it also erases the look kept in flash.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/build/${{ matrix.board }}/flash_args
            firmware/build/${{ matrix.board }}/bootloader/bootloader.bin
            firmware/build/${{ matrix.board }}/partition_table/partition-table.bin
            firmware/build/${{ matrix.board }}/lilpet.bin
            firmware/build/${{ matrix.board }}/merged-binary.bin
            firmware/build/${{ matrix.board }}/THIRD_PARTY.md
          if-no-files-found: error
          retention-days: 30

  playwright:
    name: PC app (Playwright)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # All tools from mise.toml: the engine:wasm task runs through mise
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.LILPET_MISE_VERSION }}

      - run: npm ci

      # WebAssembly build in the official Emscripten image, same as locally
      - name: Build the engine for the browser
        run: mise run engine:wasm

      # Headless shell only, without --with-deps: the runner image already has its libraries, and the apt fonts that
      # option adds took about 11 minutes to download
      - name: Install Chromium
        run: npx playwright install --only-shell chromium

      # Builds the PC app first: it ships the engine it was built with, and tests/app.spec.mjs opens this build
      - name: Open the PC app with a fake board
        run: npm run test:playwright

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
