name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call: # by release.yml, on a version tag, before it publishes the firmware

permissions:
  contents: read

# A newer push to a pull request replaces its run. Each push to dev or main has a group of its own, so that every merge
# commit gets a whole result: in a shared group, the next run cancels the one running, or without cancel-in-progress,
# the one waiting behind it. No other run joins a push's group, so cancel-in-progress cancels only pull request runs.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: true

env:
  # The mise every job installs (min_version in mise.toml is the oldest that works); Renovate keeps it current. Not
  # named MISE_*: mise reads its own settings from that prefix.
  LILPET_MISE_VERSION: 2026.11.12

# The check, engine and playwright jobs are the three parts of `mise run check` (mise.toml), run in parallel: a part added
# there goes here too. The firmware jobs are `mise run firmware:build-all`, one board each.
jobs:
  check:
    name: Format, lint, data, script and app tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, for the secret scan
          persist-credentials: false # no job pushes: npm ci's install scripts then find no token in .git/config

      # Installs the tools from mise.toml, same as local development and as the engine and playwright jobs, with no
      # list here to keep in step with mise.toml. No cache: mise installs the 11 tools in about 4 s, and restoring the
      # 281 MB entry took as long. Actions are pinned by commit, since a tag can be moved; Dependabot updates the pin
      # and its comment.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.LILPET_MISE_VERSION }}
          cache: false

      # The pre-commit hook scans what is staged, but a commit can skip it (--no-verify, a worktree without its hooks)
      - name: Scan the history for secrets
        run: gitleaks git --redact --no-banner --verbose

      - run: npm ci

      # The same command as locally (package.json): format, lint (TS, shell, workflow, Python), types, data, generated
      # files, board scripts on a fake port, code map, PC app tests. No browser or engine build needed.
      - name: Check
        run: npm run check

  engine:
    name: C engine (format, tests with sanitizers, clang-tidy, WebAssembly)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CMake, Ninja, clang-format, clang-tidy and Node from mise.toml; the WebAssembly build runs in Docker
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.LILPET_MISE_VERSION }}
          cache: false # as in the check job

      - name: Check the engine
        run: mise run engine:check

      # What the engine drew instead of a reference render (scripts/goldens.ts), to look at
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: goldens-drawn-instead
          path: engine/build/goldens
          if-no-files-found: ignore
          retention-days: 7

      # Timings go to the job summary, to follow from commit to commit. Not a pass/fail check: shared runners are
      # too noisy for a time limit. Also runs the tests on the optimized build.
      - name: Benchmark the renderer
        run: mise run engine:bench

  esp32:
    name: ESP32-S3 firmware build (${{ matrix.board }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The folders of firmware/boards that hold a board.cmake, which scripts/ci.test.ts checks: a board added there
        # goes here too, and its job into the required checks of both rulesets. Written here rather than listed by a
        # job, which the firmware jobs waited for, 6 to 10 s.
        board: [atoms3r, stamp_s3a, waveshare_132, waveshare_175]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise only runs the task: the build happens in the ESP-IDF image pinned in firmware/Dockerfile
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.LILPET_MISE_VERSION }}
          install: false
          cache: false

      # Compiler cache of the firmware build (firmware/.ccache): a full ESP-IDF build takes about 2 minutes without it.
      # Each push run of dev saves a new entry per board, read from then on by the runs that start from the latest one
      # of the same board, ESP-IDF image and options. Pull requests, main and tags read dev's entries and save none:
      # main's own, older ones would come first for its next runs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache
        with:
          path: firmware/.ccache
          key: ccache-${{ matrix.board }}-${{ hashFiles('firmware/Dockerfile', 'firmware/sdkconfig.defaults*') }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.board }}-${{ hashFiles('firmware/Dockerfile', 'firmware/sdkconfig.defaults*') }}-

      # Same command as locally; proves the engine compiles for the chip (no hardware needed) and gives a binary
      # ready to flash
      - name: Build the firmware
        run: mise run firmware:build
        env:
          BOARD: ${{ matrix.board }}
          MISE_TASK_RUN_AUTO_INSTALL: 'false' # the task needs Docker only, not the tools of mise.toml

      # Not when the exact entry was found: a re-run of the same commit
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/dev' && steps.ccache.outputs.cache-hit != 'true'
        with:
          path: firmware/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # The licence of the BMI270 file asks for its notice to go with the binaries
      - name: Add the notices
        run: cp THIRD_PARTY.md firmware/build/${{ matrix.board }}/

      # Flash from the folder of the right board, keeping its look: uvx esptool --chip esp32s3 write-flash @flash_args
      # merged-binary.bin, written at 0x0, is for a blank board: it also erases the look kept in flash.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/build/${{ matrix.board }}/flash_args
            firmware/build/${{ matrix.board }}/bootloader/bootloader.bin
            firmware/build/${{ matrix.board }}/partition_table/partition-table.bin
            firmware/build/${{ matrix.board }}/lilpet.bin
            firmware/build/${{ matrix.board }}/merged-binary.bin
            firmware/build/${{ matrix.board }}/THIRD_PARTY.md
          if-no-files-found: error
          retention-days: 30

  playwright:
    name: PC app (Playwright)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # All tools from mise.toml: the engine:wasm task runs through mise
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.LILPET_MISE_VERSION }}
          cache: false # as in the check job

      - run: npm ci

      # WebAssembly build in the official Emscripten image, same as locally
      - name: Build the engine for the browser
        run: mise run engine:wasm

      # Headless shell only, without --with-deps: the runner image already has its libraries, and the apt fonts that
      # option adds took about 11 minutes to download
      - name: Install Chromium
        run: npm exec -w app -- playwright install --only-shell chromium

      # Builds the PC app first: it ships the engine it was built with, and app/tests/app.spec.ts opens this build
      - name: Open the PC app with a fake board
        run: npm run test:playwright

      # The app just built and tested, for release.yml to publish on GitHub Pages: on a version tag only, with the
      # notices of what it bundles (React, the Emscripten runtime, the font), which their licences ask for
      - name: Add the third-party notices to the PC app
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp THIRD_PARTY.md app/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: pc-app
          path: app/dist
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
