name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Installs the tools from mise.toml, same as local development (only Node is needed here)
      - uses: jdx/mise-action@v5
        with:
          install_args: node

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Validate looks and scenes
        run: npm run check:data

      # engine/tests/js_vectors.h must match what the prototype computes today
      - name: Engine test values up to date
        run: npm run check:vectors

  engine:
    name: C engine (format, tests with sanitizers, clang-tidy, WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # CMake, Ninja, clang-format, clang-tidy and Node from mise.toml; the WebAssembly build runs in Docker
      - uses: jdx/mise-action@v5

      - name: Check the engine
        run: mise run engine:check

      # Timings go to the job summary, to follow from commit to commit. Not a pass/fail check: shared runners are
      # too noisy for a time limit. Also runs the tests on the optimized build.
      - name: Benchmark the renderer
        run: mise run engine:bench

  esp32:
    name: ESP32-S3 firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Latest ESP-IDF image, same as mise run firmware:build; proves the engine compiles for the chip (no hardware
      # needed) and gives a binary ready to flash
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: esp32s3
          path: firmware
          command: idf.py build merge-bin

      # Flash with: uvx esptool --chip esp32s3 write-flash 0x0 merged-binary.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32s3
          path: firmware/build/merged-binary.bin
          retention-days: 30

  parity:
    name: Parity, C engine vs prototype (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # All tools from mise.toml: the engine:wasm task runs through mise
      - uses: jdx/mise-action@v5

      - run: npm ci

      # WebAssembly build in the official Emscripten image, same as locally
      - name: Build the engine for the browser
        run: mise run engine:wasm

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare every reference scene
        run: npm run test:parity

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
