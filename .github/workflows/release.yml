# On a version tag, checks the tagged commit with the whole CI, then publishes a GitHub Release that holds the firmware
# of each board (the CI artifacts expire after 30 days, a Release stays), and the PC app on GitHub Pages. The tag is
# annotated (git tag -a) and its message becomes the release notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Before the 20 minutes of CI: the tag is annotated, names the firmware version it publishes (a tag pushed before the
  # bump would label old firmware) and is on main. Through the API: no checkout for one file.
  tag:
    name: Check the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      object: ${{ steps.tag.outputs.object }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: tag
        name: Check the tag against the firmware version and main
        shell: bash # with pipefail: a failed gh api stops here, not as an empty version
        run: |
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" \
            -q 'select(.object.type == "tag") | .object.sha')
          if [ -z "$object" ]; then echo "::error::$GITHUB_REF_NAME is not an annotated tag" && exit 1; fi
          version=$(gh api "repos/$GH_REPO/contents/firmware/CMakeLists.txt?ref=$GITHUB_SHA" \
            -H 'Accept: application/vnd.github.raw' | sed -n 's/^set(PROJECT_VER "\([^"]*\)").*/\1/p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME tags firmware version '$version' (firmware/CMakeLists.txt)" && exit 1
          fi
          on_main=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" \
            -q '.status == "identical" or .status == "behind"')
          if [ "$on_main" != true ]; then
            echo "::error::$GITHUB_REF_NAME tags a commit that is not on main" && exit 1
          fi
          # A drawing change bumps the engine's minor version at least: the PC app tells a board that draws unlike its
          # preview by it (drawsLike, app/src/device/protocol.ts). Drawing changed when the goldens did since the last
          # Release: an image (its blob), or the frame hashes of animation.txt, in order. The rest of that file (its
          # comments, the run and part labels) names the script and the parts, not what is drawn. Each value is read on
          # its own line, so that a failed call stops here.
          previous=$(gh api "repos/$GH_REPO/releases/latest" -q .tag_name)
          images() {
            gh api "repos/$GH_REPO/contents/engine/tests/goldens?ref=$1" \
              -q '.[] | select(.name != "animation.txt") | "\(.name) \(.sha)"'
          }
          frames() {
            gh api "repos/$GH_REPO/contents/engine/tests/goldens/animation.txt?ref=$1" \
              -H 'Accept: application/vnd.github.raw' | sed -En 's/^[^#].*: ([0-9a-f]+)$/\1/p'
          }
          engine() {
            gh api "repos/$GH_REPO/contents/engine/include/lilpet/lilpet.h?ref=$1" -H 'Accept: application/vnd.github.raw' |
              sed -n 's/^#define LP_VERSION_\(MAJOR\|MINOR\) *\([0-9]*\).*/\2/p' | paste -sd.
          }
          images_before=$(images "$previous")
          images_now=$(images "$GITHUB_SHA")
          frames_before=$(frames "$previous")
          frames_now=$(frames "$GITHUB_SHA")
          engine_before=$(engine "$previous")
          engine_now=$(engine "$GITHUB_SHA")
          for value in "$images_before" "$images_now" "$frames_before" "$frames_now" "$engine_before" "$engine_now"; do
            if [ -z "$value" ]; then
              echo "::error::cannot read the goldens or the engine's version at $previous and $GITHUB_SHA" && exit 1
            fi
          done
          if { [ "$images_before" != "$images_now" ] || [ "$frames_before" != "$frames_now" ]; } &&
            [ "$engine_before" = "$engine_now" ]; then
            echo "::error::the goldens changed since $previous, the engine's minor version did not (lilpet.h)" && exit 1
          fi
          echo "object=$object" >> "$GITHUB_OUTPUT"

  # The same jobs as for a pull request (ci.yml), run on the tagged commit, with no step copied here. The permissions
  # are given again: without them, a called workflow gets the token's default ones.
  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub Release
    needs: [tag, ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # creates the Release; this job only
    steps:
      # One folder per board, firmware-<board>, from the esp32 jobs of this run. With a single board, download-artifact
      # would extract it without its folder, and the next step would find nothing to zip.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*

      # The boards' files share their names: one zip per board, which keeps the folders that flash_args names
      - name: Zip the firmware of each board
        run: |
          for dir in firmware-*/; do
            board=${dir#firmware-}
            (cd "$dir" && zip -r "../lilpet-$GITHUB_REF_NAME-${board%/}.zip" .)
          done

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_OBJECT: ${{ needs.tag.outputs.object }}
        run: |
          notes=$(gh api "repos/$GH_REPO/git/tags/$TAG_OBJECT" -q .message)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" lilpet-*.zip

  # The PC app the CI built and tested on the tagged commit, with its engine, at https://nexlein.github.io/lilpet/. Its
  # paths are relative (app/vite.config.ts), so it works from that folder. The github-pages environment allows the v*
  # tags to deploy.
  pages:
    name: PC app on GitHub Pages
    needs: [tag, ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pages: write # deploys; this job only
      id-token: write # proves to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pc-app
          path: app

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
