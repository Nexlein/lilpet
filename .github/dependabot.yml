version: 2
updates:
  # Dev tooling (Prettier, oxlint)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # ESP-IDF release used to build the firmware (firmware/Dockerfile)
  - package-ecosystem: docker
    directory: /firmware
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
